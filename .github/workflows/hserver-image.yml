name: Build hserver image

on:
  push:
    branches: [master]
    # Only the youtube-observer server image; Android changes do not rebuild it.
    paths:
      - server/**
      - apps/backoffice/**
      - scripts/german-matcher.py
      - deploy/Dockerfile
      - deploy/Dockerfile.dockerignore
      - hserver-app.json
      - .github/workflows/hserver-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: hserver-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        env:
          SERVICE: "youtube-observer"
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${SERVICE}" >> "$GITHUB_OUTPUT"
      - name: Build native AMD64 image and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: "."
          file: "deploy/Dockerfile"
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=hserver-image
          cache-to: type=gha,mode=max,scope=hserver-image
      - name: Write immutable release metadata
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os
          release = {"image": os.environ["IMAGE"], "version": os.environ["GITHUB_SHA"], "digest": os.environ["DIGEST"]}
          with open("release.json", "w") as f:
              json.dump(release, f, indent=2)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("```json\n" + json.dumps(release, indent=2) + "\n```\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: release.json
          retention-days: 30
