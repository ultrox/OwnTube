# LEGACY, rollback only: releases up to owntube-deepseek-key-20261120-1 used
# hserver-built localhost:5555 images. New releases use hserver-app.json and
# config/deploy.hserver.yml (CI-built GHCR images; see deploy/README.md). Never
# build or `kamal deploy` with this file. Rollback example, from the repo root:
#   kamal rollback owntube-curated-nav-20261120-1 -c deploy/deploy.yml
service: youtube-observer
image: youtube-observer

servers:
  web:
    hosts:
      - hserver

ssh:
  user: marko
  keys:
    - ~/.ssh/id_ed25519
  keys_only: true
  proxy_command: "tailscale nc %h %p"

# Cloudflare Tunnel provides HTTPS; share hserver's existing loopback proxy.
proxy:
  ssl: false
  host: ytdash.gromobran.com
  app_port: 3210
  forward_headers: true
  healthcheck:
    path: /health
  run:
    bind_ips:
      - 127.0.0.1
    http_port: 8080
    https_port: 8443

registry:
  server: localhost:5555

# No remote builder: images are never built on hserver (administrator policy).
builder:
  arch: amd64

env:
  clear:
    COOKIE_SECURE: "true"
    TIMEZONE: Europe/Zurich
  # Home German mix. Read from the git-ignored .env via .kamal/secrets; never committed.
  # Takes precedence over a key saved in the Curated editor. Note: YouTube bot-checks
  # per-video audio lookups from this datacenter address, so few matches are expected.
  secret:
    - DEEPSEEK_API_KEY

volumes:
  - youtube-observer-data:/app/data
